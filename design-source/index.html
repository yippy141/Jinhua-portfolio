<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Jinhua Yip — Sea of Consciousness</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: #050807;
    --bg-1: #07100e;
    --ink: #d8e8e2;
    --ink-soft: #8aa39c;
    --ink-faint: #4a605a;
    --line: #1a2a26;
    --line-strong: #2a4039;
    --accent: #7fd9b8;
    --accent-warm: #e8c87f;
    --accent-cool: #9fc8e0;
    --danger: #c66;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg-0); color: var(--ink); font-family: 'Newsreader', Georgia, serif; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse at 20% 10%, rgba(20, 60, 50, 0.18), transparent 55%),
      radial-gradient(ellipse at 80% 110%, rgba(40, 70, 90, 0.14), transparent 55%),
      linear-gradient(180deg, #050a0a 0%, #03080a 60%, #020607 100%);
  }
  body::before {
    /* fine grain */
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image:
      radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      radial-gradient(rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
    mix-blend-mode: screen;
    opacity: 0.4;
  }
  body::after {
    /* vignette */
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(0,0,0,0.45) 100%);
  }

  #bg-canvas { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; display: block; }
  #app { position: relative; z-index: 10; height: 100%; }

  /* ────── taxonomy drift ────── */
  .taxonomy-layer { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
  .tax-word {
    position: absolute; left: -40%;
    font-family: 'Newsreader', serif; font-style: italic; white-space: nowrap;
    animation: drift linear infinite;
    will-change: transform;
  }
  .tax-latin { font-weight: 400; }
  .tax-common { font-family: 'IBM Plex Mono', monospace; font-style: normal; font-size: 0.65em; letter-spacing: 0.08em; text-transform: lowercase; }
  .tax-d0 { font-size: 18px; opacity: 0.10; color: #6fa899; }
  .tax-d1 { font-size: 28px; opacity: 0.07; color: #4a807a; }
  .tax-d2 { font-size: 14px; opacity: 0.13; color: #8db8a9; }
  .tax-d3 { font-size: 22px; opacity: 0.05; color: #5c8e85; }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(180vw); }
  }

  /* ────── nav ────── */
  .nav {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 26px 40px; z-index: 60;
    pointer-events: none;
  }
  .nav > * { pointer-events: auto; }
  .nav-left { display: flex; align-items: baseline; gap: 16px; }
  .brand { font-family: 'Instrument Serif', serif; font-size: 28px; letter-spacing: 0.005em; color: var(--ink); }
  .brand-sub { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); }
  .nav-right { display: flex; align-items: center; gap: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); }
  .nav-link { color: var(--ink-soft); text-decoration: none; transition: color .2s; padding: 4px 0; border-bottom: 1px solid transparent; }
  .nav-link:hover { color: var(--ink); border-bottom-color: var(--accent); }
  .nav-dot { color: var(--ink-faint); }
  .nav-sep { width: 1px; height: 14px; background: var(--line); margin: 0 4px; }
  .nav-icon { color: var(--ink-soft); display: inline-flex; padding: 4px; transition: color .2s; }
  .nav-icon:hover { color: var(--accent); }

  /* ────── hero ────── */
  .hero {
    position: fixed; left: 40px; right: 40px; bottom: 40px; z-index: 20;
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    grid-template-rows: auto auto;
    gap: 14px 60px;
    align-items: end;
  }
  .eyebrow {
    grid-column: 1 / -1;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.22em;
    color: var(--accent); display: flex; align-items: center; gap: 10px;
  }
  .eyebrow-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }

  .display {
    grid-column: 1 / 2;
    margin: 0;
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: clamp(40px, 6.2vw, 96px);
    line-height: 0.96;
    letter-spacing: -0.012em;
    color: var(--ink);
    text-wrap: balance;
    max-width: 14ch;
  }
  .display em { font-style: italic; color: var(--accent); font-weight: 400; }

  .hero-foot {
    grid-column: 2 / 3;
    display: flex; flex-direction: column; gap: 22px; padding-bottom: 4px;
  }
  .positioning {
    margin: 0; max-width: 38ch;
    font-family: 'Newsreader', serif; font-size: 17px; line-height: 1.5;
    color: var(--ink-soft); text-wrap: pretty;
  }
  .positioning::before {
    content: '↳ '; color: var(--accent); font-family: 'IBM Plex Mono', monospace;
  }
  .hero-meta {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-faint);
    border-top: 1px solid var(--line); padding-top: 14px; max-width: 360px;
  }
  .meta-row { display: flex; justify-content: space-between; gap: 10px; }
  .meta-row > span:first-child { color: var(--ink-faint); }
  .meta-row > span:last-child { color: var(--ink-soft); }
  .status-ok { color: var(--accent) !important; }
  .status-ok::before { content: '● '; }

  /* ────── dossier cards ────── */
  .dossier {
    position: fixed; z-index: 5;
    cursor: pointer; outline: none;
    transition: transform .55s cubic-bezier(.2,.8,.2,1), opacity .4s, filter .4s;
    will-change: transform, opacity;
  }
  .dossier-frame {
    position: relative;
    background: rgba(8, 14, 14, 0.78);
    border: 1px solid var(--line-strong);
    backdrop-filter: blur(6px);
    transition: border-color .3s, box-shadow .3s, padding .3s, width .55s cubic-bezier(.2,.8,.2,1);
    width: 116px;
    padding: 14px 16px;
  }
  .dossier:hover .dossier-frame, .dossier:focus .dossier-frame {
    border-color: var(--accent, #7fd9b8);
    box-shadow: 0 0 0 1px rgba(127,217,184,0.05), 0 8px 40px rgba(0,0,0,0.6), 0 0 80px -20px var(--accent, #7fd9b8);
  }
  .dossier.is-expanded .dossier-frame {
    width: 380px;
    padding: 20px;
    border-color: var(--accent, #7fd9b8);
  }
  .tick {
    position: absolute; width: 8px; height: 8px; border: 1px solid var(--accent, #7fd9b8);
  }
  .tick.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .tick.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
  .tick.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
  .tick.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  .dossier:not(:hover):not(:focus):not(.is-expanded) .tick { opacity: 0.35; }

  .dossier-mini { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .code-block { display: flex; align-items: baseline; gap: 6px; }
  .code-main { font-family: 'Instrument Serif', serif; font-size: 28px; font-style: italic; color: var(--ink); line-height: 1; }
  .code-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); letter-spacing: 0.12em; }
  .code-meta { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--ink-faint); letter-spacing: 0.16em; text-transform: uppercase; }

  /* expanded */
  .dossier-open { display: flex; flex-direction: column; gap: 14px; }
  .dossier-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .dossier-codes { display: flex; align-items: baseline; gap: 6px; }
  .code-big { font-family: 'Instrument Serif', serif; font-size: 38px; font-style: italic; color: var(--ink); line-height: 1; }
  .code-big.sub { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--accent, #7fd9b8); letter-spacing: 0.1em; font-style: normal; }
  .dossier-meta { text-align: right; display: flex; flex-direction: column; gap: 6px; }
  .meta-line { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--ink-faint); letter-spacing: 0.18em; }
  .meta-tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .tag { font-family: 'IBM Plex Mono', monospace; font-size: 8px; padding: 2px 5px; border: 1px solid var(--line-strong); color: var(--ink-soft); letter-spacing: 0.12em; }

  .dossier-title { margin: 0; font-family: 'Instrument Serif', serif; font-size: 26px; line-height: 1.05; color: var(--ink); font-weight: 400; }

  .dossier-video {
    position: relative; aspect-ratio: 4/3; background: #0a1010;
    border: 1px solid var(--line-strong); overflow: hidden;
  }
  .dossier-video::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, transparent 0%, transparent 96%, rgba(127,217,184,0.04) 100%),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 3px);
    z-index: 2;
  }
  .demo-svg { width: 100%; height: 100%; display: block; }
  .video-chrome {
    position: absolute; bottom: 6px; left: 8px; right: 8px;
    display: flex; align-items: center; gap: 8px; z-index: 3;
    font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--ink-soft); letter-spacing: 0.14em;
  }
  .rec-dot { width: 6px; height: 6px; background: var(--danger); border-radius: 50%; animation: rec-blink 1.4s infinite; }
  @keyframes rec-blink { 50% { opacity: 0.2; } }
  .rec-time { margin-left: auto; color: var(--ink-faint); }

  .dossier-desc { margin: 0; font-family: 'Newsreader', serif; font-size: 14px; line-height: 1.55; color: var(--ink-soft); text-wrap: pretty; }
  .dossier-foot { display: flex; align-items: center; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--ink-faint); letter-spacing: 0.14em; }
  .foot-key { padding: 2px 4px; border: 1px solid var(--line-strong); color: var(--ink-soft); }
  .foot-spacer { flex: 1; }

  /* ────── controls ────── */
  .controls { position: fixed; top: 90px; right: 40px; z-index: 30; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .ctrl {
    background: rgba(8, 14, 14, 0.7); border: 1px solid var(--line-strong);
    color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    letter-spacing: 0.18em; text-transform: uppercase; padding: 8px 14px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; transition: all .2s;
    backdrop-filter: blur(6px);
  }
  .ctrl:hover { border-color: var(--accent); color: var(--ink); }
  .ctrl.is-on { color: var(--accent-warm); border-color: var(--accent-warm); }
  .ctrl-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); }
  .ctrl-dot.live { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .ctrl-hint { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--ink-faint); letter-spacing: 0.14em; }

  .hint-bottom {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 25;
    font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--ink-faint); letter-spacing: 0.2em; text-transform: uppercase;
    pointer-events: none; opacity: 0.5;
  }

  /* small-screen guard */
  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; gap: 16px; }
    .display { font-size: 44px; }
    .nav { padding: 18px 20px; }
    .controls { right: 20px; top: 70px; }
    .hero { left: 20px; right: 20px; bottom: 20px; }
  }
</style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div id="app"></div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="particles.js"></script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
